name: CD
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted   # runner on the Production Server
    steps:
      - name: Rolling update
        run: |
          kubectl set image deployment/<deployment-name> <container-name>=${{ secrets.DOCKER_USERNAME }}/weather-ml-app:v1
          kubectl rollout status deployment/<deployment-name>
