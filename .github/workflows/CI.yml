name: CI
on:
  push:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test
        run: python -m unittest smoke_test.py
      - name: Unit test
        run: python -m unittest unit_test.py
      - name: Integration test
        run: python -m unittest integration_test.py

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/weather-ml-app:v1 .

      - name: Build test (container launches)
        run: |
          docker run -d --name test-container ${{ secrets.DOCKER_USERNAME }}/weather-ml-app:v1
          sleep 5
          docker exec test-container python --version
          docker rm -f test-container

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/weather-ml-app:v1
