name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: weather-ml-app
  IMAGE_TAG: v2

jobs:
  test-and-build:
    runs-on: self-hosted

    env:
      PYTHONPATH: ${{ github.workspace }}/Weather-ML-CICD-Incomplete

    defaults:
      run:
        working-directory: Weather-ML-CICD-Incomplete

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create virtual environment
        run: |
          rm -rf $RUNNER_TEMP/venv
          python3 -m venv $RUNNER_TEMP/venv

      - name: Install dependencies
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m unittest discover -s tests -p "smoke_test.py" -v

      - name: Run Unit Tests
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m unittest discover -s tests -p "unit_test.py" -v

      - name: Run Integration Tests
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m unittest discover -s tests -p "integration_test.py" -v

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Verify Docker Image
        run: |
          docker run -d --name build-test \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          sleep 10
          docker exec build-test python --version

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Cleanup
        if: always()
        run: |
          docker rm -f build-test || true
          docker image prune -f
          docker builder prune -f
