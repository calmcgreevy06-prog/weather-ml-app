name: CI

# (a) Detect changes to the GitHub repository
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: weather-ml-app
  IMAGE_TAG: v2            # change to v2 for the video demo

jobs:
  build-test-push:
    runs-on: self-hosted   # Build Server runner

    env:
      PYTHONPATH: ${{ github.workspace }}/Weather-ML-CICD-Incomplete

    # Project files live in the Weather-ML-CICD-Incomplete/ folder of the repo
    defaults:
      run:
        working-directory: Weather-ML-CICD-Incomplete

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # (b) Install Flask and dependencies in requirements.txt
      - name: Install dependencies
        run: |
          rm -rf $RUNNER_TEMP/venv
          python3 -m venv $RUNNER_TEMP/venv
          . $RUNNER_TEMP/venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # (c) Run each test file in its own step, in order
      - name: Smoke test
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m unittest discover -s tests -p "smoke_test.py" -v

      - name: Unit test
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m unittest discover -s tests -p "unit_test.py" -v

      - name: Integration test
        run: |
          . $RUNNER_TEMP/venv/bin/activate
          python -m unittest discover -s tests -p "integration_test.py" -v

      # (d) Build a Docker image from the Dockerfile
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # (e) Build test: launch a container and run a command inside it
      - name: Build test - launch container
        run: |
          docker run -d --name build-test ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 10
          docker ps --filter "name=build-test"
          docker exec build-test python --version

      - name: Clean up test container
        if: always()
        run: docker rm -f build-test || true

      # (f) Push the image to DockerHub
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Clean up Docker
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f
          df -h /
