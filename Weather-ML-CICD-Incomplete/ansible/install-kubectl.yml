
---
- name: Install Kubectl
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Get latest Kubernetes version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: version

    - name: Download Kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Verify Kubectl
      ansible.builtin.command: kubectl version --client
      changed_when: false
