
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: weather-ml-app
  template:
    metadata:
      labels:
        app: weather-ml-app
    spec:
      containers:
        - name: weather-ml-app
          image: cal7m7/weather-ml-app:latest
          ports:
            - containerPort: 5000
